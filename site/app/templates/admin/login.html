<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Staff login – JPS</title><link rel="icon" href="/static/logo.png"><link rel="stylesheet" href="/static/style.css?v=2"><link rel="stylesheet" href="/static/admin.css?v=2"></head>
<body class="loginpage">
<form class="panel loginbox" method="post" action="/admin/login">
 <img src="/static/logo.png" alt="" width="88" height="88">
 <h1 class="h2">Staff login</h1>
 <p class="note" style="margin-bottom:20px">Just Professional Services admin</p>
 {% if error %}<div class="flash err">{{ icon('info') }} {{ error }}</div>{% endif %}
 <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="next" value="{{ next }}">
 <div class="f"><label for="u">Username</label><input class="inp" id="u" name="username" autocomplete="username" autofocus></div>
 <div class="f"><label for="p">Password</label><input class="inp" id="p" name="password" type="password" autocomplete="current-password"></div>
 <button class="btn btn-blue full" type="submit">Log in</button>
 <a class="note" href="/" style="display:block;margin-top:16px">← Back to website</a>
</form>
</body></html>
